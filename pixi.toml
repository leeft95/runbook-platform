[workspace]
name = "runbook-platform"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.0.2"

[dependencies]
python = "3.11.*"
pandas = "*"
numpy = "*"
pyarrow = "*"
plotly = "*"
pydantic = "*"
loguru = "*"
statsmodels = "*"
isoweek = "*"
scipy = "*"
holidays = "*"
pytz = "*"
requests = "*"
croniter = "*"
fastapi = "*"
dash = "*"
dash-ag-grid = "*"
sqlalchemy = "*"
psycopg = "*"
alembic = "*"
uvicorn = "*"
ruff = "*"
pre-commit = "*"
pytest = ">=9.0.2,<10"
pytest-cov = "*"
mypy = "*"
types-requests = "*"
python-build = "*"
wheel = "*"
sphinx = ">=8,<9"
myst-parser = ">=4,<5"
furo = ">=2024.8"

[pypi-dependencies]
runbook-core = { path = "packages/runbook/runbook-core", editable = true }
runbook-data = { path = "packages/runbook/runbook-data", editable = true }
runbook-platform = { path = "packages/runbook/runbook-platform", editable = true }
runbook-sdk = { path = "packages/runbook/runbook-sdk", editable = true }
runbook-services = { path = "packages/runbook/runbook-services", editable = true }
runbook-worker = { path = "packages/runbook/runbook-worker", editable = true }
prophet = "*"

[tasks]
test = "pytest -q"
test-cov = "pytest -q --cov=runbook --cov-report=term-missing"
lint = "ruff check ."
format-check = "ruff format --check ."
docs = "sphinx-build -W --keep-going -b html docs docs/_build/html"
docs-serve = { cmd = "python -m http.server 8765 --bind 127.0.0.1 --directory docs/_build/html", depends-on = ["docs"] }
typecheck = "mypy packages tests --python-version 3.11 --ignore-missing-imports --namespace-packages --explicit-package-bases"
preview = "runbook-preview"
tick = "runbook-services tick"
