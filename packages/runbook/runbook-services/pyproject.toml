[project]
name = "runbook-services"
version = "0.1.0"
requires-python = ">=3.11"
description = "PostgreSQL-backed API and Dash operations UI for Runbook."
license = "Apache-2.0"
dependencies = [
    "runbook-core",
    "croniter",
    "fastapi>=0.115,<1",
    "dash[fastapi]>=4.2,<5",
    "dash-ag-grid>=35,<36",
    "sqlalchemy[asyncio]>=2,<3",
    "psycopg[binary]>=3,<4",
    "alembic>=1,<2",
    "uvicorn>=0.30,<1",
    "loguru",
]

[project.scripts]
runbook-services = "runbook.services.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["runbook.services*"]

[tool.setuptools.package-data]
"runbook.services" = ["assets/*.css", "assets/*.js", "migrations/*.ini", "migrations/*.py", "migrations/versions/*.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
