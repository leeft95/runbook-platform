[project]
name = "runbook-platform"
version = "0.0.2"
description = "Deterministic scheduling and snapshot-pinned execution helpers."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "redcombojnr" }]
urls = { Repository = "https://github.com/redcombojnr/runbook-platform" }
dependencies = ["runbook-data", "runbook-sdk", "croniter", "loguru"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["runbook.platform*"]
