[project]
name = "runbook-sdk"
version = "0.1.0"
description = "Analyst report authoring, deterministic execution, caching, preview, and HTML rendering."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "redcombojnr" }]
urls = { Repository = "https://github.com/redcombojnr/runbook-platform" }
dependencies = ["pandas", "pyarrow", "plotly", "pydantic", "loguru", "runbook-core", "runbook-data"]

[project.optional-dependencies]
dash = ["dash>=4.2,<5", "dash-ag-grid>=35,<36"]

[project.scripts]
runbook-preview = "runbook.sdk.preview_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["runbook.sdk*"]
