[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runbook-core"
version = "0.3.1"
description = "Pure deterministic contracts, analysis, tables, and plots for Runbook."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "leeft95" }]
urls = { Repository = "https://github.com/leeft95/runbook-platform" }
dependencies = [
    "pandas", "numpy", "pyarrow", "prophet", "pydantic", "loguru", "statsmodels", "isoweek", "plotly", "scipy", "holidays", "pytz"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["runbook.core*"]
namespaces = true

[tool.setuptools.package-data]
"runbook.core.pdl" = ["spec.json"]
"runbook.core.table" = ["spec.json"]
