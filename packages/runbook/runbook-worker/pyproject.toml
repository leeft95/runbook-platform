[project]
name = "runbook-worker"
version = "0.2.6"
requires-python = ">=3.11"
description = "One-process-per-run source and report execution for Runbook."
license = "Apache-2.0"
dependencies = [
    "runbook-core",
    "runbook-data",
    "runbook-sdk",
    "runbook-services",
]

[project.scripts]
runbook-worker = "runbook.worker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["runbook.worker*"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
