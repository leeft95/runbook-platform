[project]
name = "runbook-data"
version = "0.3.1"
description = "Generic source ingestion, immutable datasets, manifests, and blob storage."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "leeft95" }]
urls = { Repository = "https://github.com/leeft95/runbook-platform" }
dependencies = [
    "pandas",
    "pyarrow",
    "pydantic",
    "requests",
    "loguru",
    "sqlalchemy>=2,<3",
    "psycopg>=3,<4",
    "runbook-core"
]

[project.optional-dependencies]
s3 = ["boto3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["runbook.data*"]
