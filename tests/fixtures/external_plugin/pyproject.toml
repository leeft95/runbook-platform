[project]
name = "runbook-test-external-plugin"
version = "0.1.0"
description = "Installable external adapter and parser fixture for Runbook."
requires-python = ">=3.11"
dependencies = ["runbook-data"]

[project.entry-points."runbook.adapters"]
test_external = "runbook_test_plugin.adapters:ExternalTestAdapter"

[project.entry-points."runbook.parsers"]
test_external_v1 = "runbook_test_plugin.parsers:parse_external"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
